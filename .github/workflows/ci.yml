name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5, Node 24
        with:
          version: 11.7.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, Node 24
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate release evidence from clean source
        run: pnpm evidence:release
      - name: Run complete validation suite
        run: pnpm check
      - name: Upload release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            .artifacts/release-evidence.json
            .artifacts/sbom.cdx.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
